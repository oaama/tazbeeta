name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: cd mobile && flutter pub get
      - run: cd mobile && flutter analyze --no-fatal-infos
      - run: cd mobile && flutter test --dart-define=DEMO=true
      - name: Build ARM64 live-API build
        run: cd mobile && flutter build apk --release --target-platform android-arm64 --split-per-abi --dart-define=API_URL=https://tazbeeta.angluosr.workers.dev
      - name: Sign with existing preview key and verify certificate reuse
        env:
          SIGNER: ${{ secrets.TAZBEETA_PREVIEW_SIGNER }}
        run: |
          set +x
          umask 077
          mkdir -p /tmp/signing
          python3 - <<'PY'
          import os,json,base64,pathlib
          data=json.loads(os.environ['SIGNER'])
          for k,n in [('key','key.pk8'),('cert','cert.pem')]:
              pathlib.Path('/tmp/signing/'+n).write_bytes(base64.b64decode(data[k]))
          PY
          unset SIGNER
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          apk=mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          "$signer" sign --key /tmp/signing/key.pk8 --cert /tmp/signing/cert.pem --out /tmp/first.apk "$apk"
          "$signer" sign --key /tmp/signing/key.pk8 --cert /tmp/signing/cert.pem --out /tmp/second.apk "$apk"
          "$signer" verify --print-certs /tmp/first.apk > /tmp/first-cert.txt
          "$signer" verify --print-certs /tmp/second.apk > /tmp/second-cert.txt
          diff /tmp/first-cert.txt /tmp/second-cert.txt
          cat /tmp/first-cert.txt
          cp /tmp/first.apk "$apk"
          rm -rf /tmp/signing /tmp/second.apk
      - uses: actions/upload-artifact@v4
        with: { name: Tazbeeta-ARM64, path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk }
      - name: Private retrieval parts
        run: |
          f=mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          mkdir /tmp/out
          sha256sum "$f" > /tmp/out/sha.txt
          base64 -w 76 "$f" > /tmp/apk.b64
          split -l 3500 -d -a 3 /tmp/apk.b64 /tmp/out/p_
          for p in /tmp/out/p_*; do mv "$p" "$p.txt"; done
          cd /tmp/out
          git init -q -b apk-arm64-v8a
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add .
          git commit -q -m "Tazbeeta stable preview ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-arm64-v8a

