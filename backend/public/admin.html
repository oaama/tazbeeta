<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tazbeeta Admin</title>
<style>
:root{--t:#0F8B8D;--t2:#0A5A5E;--ink:#1c2733;--mut:#6b7684;--line:#e6eaf0}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Roboto,"Noto Naskh Arabic",Tahoma,sans-serif;color:var(--ink);background:#f3f7fa;min-height:100vh}
header{background:linear-gradient(135deg,var(--t),var(--t2));color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 4px 18px rgba(27,150,194,.25)}
main{max-width:1040px;margin:22px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 2px 12px rgba(20,40,60,.05);overflow-x:auto}
textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;resize:vertical}input,button,select{font:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--line)}button{background:var(--t);color:#fff;border:0;cursor:pointer;transition:.15s}button:hover{filter:brightness(1.07)}button.s{background:#fff;color:var(--t);border:1px solid var(--t)}
table{width:100%;border-collapse:collapse}td,th{text-align:start;padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}tr:last-child td{border-bottom:0}
.stats{margin-bottom:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.stat{margin:0;border-inline-start:5px solid var(--t);color:var(--mut);font-size:13px}.stat b{font-size:32px;display:block;color:var(--ink);margin:4px 0}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;color:#fff;border:0;opacity:.8;border-radius:10px;padding:8px 12px}nav button.on{opacity:1;background:rgba(255,255,255,.2)}
.err{color:#d93025}.mut{color:var(--mut);font-size:13px}.ic{width:26px;height:26px;color:var(--t);float:inline-end}.stat span{display:block}.bar{display:flex;height:12px;border-radius:8px;overflow:hidden;background:#eef2f6;margin:8px 0}.bar i{display:block}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:4px}h3{margin:0 0 8px}#lang{background:rgba(255,255,255,.2);padding:6px 12px}
@media(max-width:640px){header{padding:12px}main{margin:12px auto}.card{padding:12px}td,th{padding:8px 6px;font-size:13px}input,select{max-width:100%}}
@media(max-width:820px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.stats{grid-template-columns:1fr}.card{overflow-x:auto}}@media(max-width:640px){table.rq,table.rq tbody{display:block}table.rq tr:first-child{display:none}table.rq tr{display:block;border:1px solid #e3e8ee;border-radius:12px;padding:8px 12px;margin-bottom:10px}table.rq td{display:block;border:0;padding:8px 0;font-size:14px;overflow-wrap:anywhere}table.rq td small{display:block;margin-top:6px;color:var(--mut)}table.rq td::before{content:attr(data-l);display:block;color:var(--mut);font-size:12px;margin-bottom:5px}table.rq td>*{max-width:100%}table.rq td:last-child::before{content:none}}</style></head><body>
<header><b style="display:flex;align-items:center;gap:12px"><img src="/brand.png" width="48" height="48" alt="Tazbeeta" style="border-radius:10px">Tazbeeta Admin · Hexa plus</b><nav id="nav" style="display:none"></nav><button id="lang" onclick="setLang(lang=='en'?'ar':'en')">العربية</button></header>
<p style="text-align:center;color:#6b7684;font-size:12px">Eng Angluos Rezq · Hexa plus</p><main id="app"></main>
<script>
let token=sessionStorage.getItem('adm'),tab='stats',requestQuery='',requestStatus='all';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(m,p,b){const r=await fetch('/api'+p,{method:m,headers:{'content-type':'application/json',authorization:'Bearer '+token},body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
function login(err){$('#nav').style.display='none';$('#app').innerHTML=`<div class="card" style="max-width:360px;margin:60px auto"><h3>Admin login</h3><p><input id="e" placeholder="Email" style="width:100%"></p><p><input id="p" type="password" placeholder="Password" style="width:100%"></p><p class="err">${esc(err||'')}</p><button id="go" style="width:100%">Login</button></div>`;
$('#go').onclick=async()=>{try{const c=await (await fetch('/api/config')).json();if(!c.supabaseUrl)throw new Error('Auth is not configured on this server');const r=await fetch(c.supabaseUrl+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'content-type':'application/json',apikey:c.supabaseAnonKey},body:JSON.stringify({email:$('#e').value,password:$('#p').value})});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Sign in failed');token=j.access_token;const me=await (await fetch('/api/me',{headers:{authorization:'Bearer '+token}})).json();if(!me.user||me.user.role!=='admin'){token=null;throw new Error('Not an admin account')}sessionStorage.setItem('adm',token);show()}catch(e){login(e.message)}}}
async function show(){try{SV={};((await api('GET','/services')).services||[]).forEach(x=>SV[x.id]=x)}catch(e){}$('#nav').style.display='block';$('#nav').innerHTML=['stats','requests','technicians','users','services','activity','conversations','feedback','content'].map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';show()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')+`<button onclick="sessionStorage.removeItem('adm');token=null;login()">Logout</button>`;
try{await views[tab]()}catch(e){if(/Unauthorized|Admins/.test(e.message))login(e.message);else $('#app').innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
const views={
async stats(){const s=await api('GET','/admin/stats');let rq=[];try{rq=(await api('GET','/admin/requests')).requests||[]}catch(e){}
const I={u:'<path d="M16 11a4 4 0 1 0-8 0 4 4 0 0 0 8 0zM4 21c0-4 3.6-6 8-6s8 2 8 6"/>',t:'<path d="M14.7 6.3a4 4 0 0 0-5 5L3 18l3 3 6.7-6.7a4 4 0 0 0 5-5l-2.5 2.5-2.2-.5-.5-2.2z"/>',r:'<path d="M8 4h8l2 2v14H6V6zM9 11h6M9 15h6"/>',p:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',w:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>'};
const ic=k=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const bR=s.byRole||{},bS=s.byStatus||{};
const cards=[['Customers',bR.customer||0,'u'],['Technicians',bR.technician||0,'t'],['Requests',s.requests||0,'r'],['Pending',bS.pending||0,'p'],['In progress',(bS.in_progress||0)+(bS.assigned||0),'w'],['Completed',bS.completed||0,'ok']];
const total=s.requests||0,seg=[['pending','#f5a524'],['assigned','#0F8B8D'],['in_progress','#0A5A5E'],['completed','#22a745'],['cancelled','#9aa5b1']];
$('#app').innerHTML=`<div class="stats">${cards.map(c=>`<div class="card stat">${ic(c[2])}<span>${c[0]}</span><b>${c[1]}</b></div>`).join('')}</div>
<div class="card"><h3>Requests by status</h3>${total?`<div class="bar">${seg.filter(x=>bS[x[0]]).map(x=>`<i style="width:${bS[x[0]]*100/total}%;background:${x[1]}" title="${x[0]}: ${bS[x[0]]}"></i>`).join('')}</div><p class="mut">${seg.filter(x=>bS[x[0]]).map(x=>`<span class="dot" style="background:${x[1]}"></span>${x[0]}: ${bS[x[0]]}`).join(' &nbsp; ')}</p>`:'<p class="mut">No requests yet.</p>'}</div>
<div class="card"><h3>Latest requests</h3>${rq.length?`<table><tr><th>Service</th><th>Status</th><th>Created</th></tr>${rq.slice(0,5).map(r=>`<tr><td>${esc(sn(r))}</td><td>${esc(r.status)}</td><td>${esc((r.createdAt||'').slice(0,10))}</td></tr>`).join('')}</table>`:'<p class="mut">No requests yet. New customer requests will appear here.</p>'}</div>`},
async users(){const result=await api('GET','/admin/users');const users=result.users.filter(u=>u.role==='customer');$('#app').innerHTML=`<div class="card"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th></th></tr>${users.map(u=>`<tr><td>${esc(u.firstName+' '+u.lastName)}</td><td>${esc(u.email)}<br><small>${esc((u.addresses||[]).map(a=>a.label+': '+a.line).join(' / '))}</small></td><td>${u.role}</td><td>${u.createdAt.slice(0,10)}</td><td>${u.role=='admin'?'':`<button class="s" onclick="blk('${u.id}',${!u.blocked})">${u.blocked?'Unblock':'Block'}</button> <button class="s" onclick="resetLink('${u.id}')">Reset link</button>`}</td></tr>`).join('')}</table></div>`},
async requests(){const result=await api('GET','/admin/requests');const requests=result.requests.filter(r=>(requestStatus==='all'||r.status===requestStatus)&&JSON.stringify(r).toLowerCase().includes(requestQuery.toLowerCase()));$('#app').innerHTML=`<div id="linkbox"></div><div class="card"><p><input id="rqquery" placeholder="Search requests" value="${esc(requestQuery)}"> <select id="rqstatus">${['all','pending','inspection','quoted','approved','assigned','in_progress','completed','cancelled'].map(s=>`<option ${s===requestStatus?'selected':''} value="${s}">${s}</option>`).join('')}</select> <button onclick="filterRequests()">Search</button></p><table class="rq"><tr><th>Service</th><th>Description / address</th><th>Status</th><th>Technician</th><th>Created</th><th></th></tr>${requests.map(r=>`<tr><td data-l="Service">${esc(sn(r))}${r.custom?`<p><b>Custom service</b>: ${esc(r.customTitle)}</p><small>${r.classifiedAt?'Classified':'Needs classification'}</small>`:''}</td><td data-l="Description / address">${esc(r.description)}<br><small>${esc(r.contactName||'')} ${esc(r.contactPhone||'')} ${esc(r.contactEmail||'')}</small><br><small>${esc(r.address)}${r.location?' (has GPS)':''}</small></td><td data-l="Status">${r.status}${r.inspection?`<p>${esc(r.inspection.note)}</p>`:''}${r.quote?`<p>${esc(r.quote.amount)} ${esc(r.quote.currency)} · ${esc(r.quote.scope)}</p>`:''}</td><td data-l="Technician">${esc(r.technicianName||'')}</td><td data-l="Created">${r.createdAt.slice(0,10)}</td><td data-l="">${r.custom&&['pending','inspection'].includes(r.status)?`<button class="s" onclick="classifyNeed('${r.id}')">Classify service</button>`:''}${['pending','inspection'].includes(r.status)?`<button class="s" onclick="recordInspection('${r.id}')">Inspection</button>`:''}${['inspection','quoted'].includes(r.status)&&(!r.custom||r.classifiedAt)?`<button class="s" onclick="companyQuote('${r.id}')">Quote</button>`:''}${['approved','assigned'].includes(r.status)?`<button class="s" onclick="suggest('${r.id}')">Assign</button> `:''}${['completed','cancelled'].includes(r.status)?'':`<button class="s" onclick="cancelReq('${r.id}')">Cancel</button>`}</td></tr>`).join('')}</table></div><div id="sug"></div>`},
async technicians(){const {users}=await api('GET','/admin/users');const t=users.filter(u=>u.role=='technician');const {services}=await api('GET','/services');$('#app').innerHTML=`<div id="linkbox"></div><div class="card"><h4>Add technician</h4><input id="fn" placeholder="First name"> <input id="ln" placeholder="Last name"> <input id="em" placeholder="Email"><p>Services: ${services.map(s=>`<label><input type="checkbox" class="sk" value="${esc(s.id)}"> ${esc(s.name)}</label>`).join(' ')}</p><button onclick="addTech()">Create and get setup link</button><p><small>No password is created. You get a one-time link to give the technician, who chooses their own password.</small></p></div><div class="card"><table><tr><th>Name</th><th>Email</th><th>Services</th><th>Available</th><th>Location</th><th></th></tr>${t.map(u=>`<tr><td>${esc(u.firstName+' '+u.lastName)}</td><td>${esc(u.email)}</td><td>${esc((u.skills||[]).join(', ')||'none set')}</td><td><button class="s" onclick="avail('${u.id}',${!u.available})">${u.available?'Available':'Unavailable'}</button></td><td>${u.location?esc(new Date(u.location.at).toLocaleString()):'never shared'}</td><td><button class="s" onclick="editSkills('${u.id}')">Services</button> <button class="s" onclick="blk('${u.id}',${!u.blocked})">${u.blocked?'Unblock':'Block'}</button> <button class="s" onclick="resetLink('${u.id}')">Reset link</button></td></tr>`).join('')}</table></div>`},
async services(){const {services}=await api('GET','/admin/services');window.serviceRows=services;$('#app').innerHTML=`<div class="card"><table><tr><th>Name</th><th>Arabic</th><th>Popular</th></tr>${services.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.nameAr)}</td><td>${s.popular?'yes':''}</td><td>${s.active?'Active':'Disabled'} <button class="s" onclick="editSvc('${s.id}')">Edit</button></td></tr>`).join('')}</table></div><div class="card"><h4>Add / update service</h4><input id="sid" placeholder="Service id (English)"> <input id="sn" placeholder="Name"> <input id="sa" placeholder="Arabic name"> <label><input type="checkbox" id="sp"> popular</label> <label><input type="checkbox" id="sactive" checked> Active</label> <button onclick="addSvc()">Save</button></div>`}};
async function blk(id,b){await api('POST','/admin/users/'+id+'/block',{blocked:b});show()}
async function cancelReq(id){await api('POST','/requests/'+id+'/status',{status:'cancelled'});show()}
function showLink(url,label){$('#linkbox').innerHTML=`<div class="card"><b>${esc(label)}</b><br>Bearer link: anyone who opens it can set that account's password. Copy it now and send it over a trusted channel. It is not stored here.<br><input readonly style="width:100%" value="${esc(url)}" onclick="this.select()"></div>`}
async function resetLink(id){const r=await api('POST','/admin/users/'+id+'/reset-link');if(!$('#linkbox'))$('#app').insertAdjacentHTML('afterbegin','<div id="linkbox"></div>');showLink(r.link,'Password reset link')}
async function addTech(){try{const r=await api('POST','/admin/technicians',{firstName:$('#fn').value,lastName:$('#ln').value,email:$('#em').value,skills:[...document.querySelectorAll('.sk:checked')].map(x=>x.value)});await show();showLink(r.setupLink,'Technician created. Setup link')}catch(e){alert(e.message)}}
async function suggest(id){const r=await api('GET','/admin/requests/'+id+'/suggest');const row=t=>`<tr><td>${esc(t.firstName+' '+t.lastName)}</td><td>${t.distanceKm!=null?t.distanceKm+' km':(t.locationAgeMin==null?'location never shared':'location '+t.locationAgeMin+' min old')}</td><td>${t.reasons?esc(t.reasons.join(', ')):`<button class="s" onclick="assign('${id}','${t.id}')">Assign</button>`}</td></tr>`;$('#sug').innerHTML=`<div class="card"><h4>Technicians for this request</h4><p>${esc(r.note)}</p><table>${r.technicians.map(row).join('')}</table><h4>Manual choice only (stale or no location)</h4><table>${r.manualOnly.map(t=>row({...t,reasons:null})).join('')}</table><details><summary>Not eligible (${r.excluded.length})</summary><table>${r.excluded.map(row).join('')}</table></details></div>`;$('#sug').scrollIntoView()}
async function classifyNeed(id){try{const {services}=await api('GET','/services');$('#sug').innerHTML=`<div class="card"><h4>Classify custom need</h4><p>Choose a company service only if it covers the need. Otherwise discuss it with the customer and add a real service through Services first.</p><select id="classSvc">${services.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select> <button onclick="saveClassification('${id}')">Confirm classification</button></div>`;$('#sug').scrollIntoView()}catch(e){alert(e.message)}}
async function saveClassification(id){try{await api('POST','/admin/requests/'+id+'/classify',{serviceId:$('#classSvc').value});await show()}catch(e){alert(e.message)}}
async function assign(r,t){try{await api('POST','/admin/requests/'+r+'/assign',{technicianId:t});show()}catch(e){alert(e.message)}}
async function addSvc(){await api('POST','/admin/services',{id:$('#sid').value,name:$('#sn').value,nameAr:$('#sa').value,popular:$('#sp').checked,active:$('#sactive').checked});show()}

function card(title,body){$('#app').innerHTML=`<div class="card"><h3>${esc(title)}</h3>${body}</div>`}
views.activity=async()=>{const {activity}=await api('GET','/admin/activity');card('Activity',activity.length?`<table><tr><th>Created</th><th>Action</th><th>User id</th></tr>${activity.map(x=>`<tr><td>${esc(new Date(x.createdAt).toLocaleString())}</td><td>${esc(x.method+' '+x.path)}</td><td>${esc(x.actorId)}</td></tr>`).join('')}</table>`:'<p>No activity yet.</p>')};
views.feedback=async()=>{const {feedback}=await api('GET','/admin/feedback');card('Feedback',feedback.length?feedback.map(f=>`<p><b>${f.stars}/5</b> · ${esc(f.userId)} · ${esc(new Date(f.createdAt).toLocaleString())}</p><p style="white-space:pre-wrap">${esc(f.note)}</p><button class="s" onclick="review('${f.id}',${!f.reviewed})">${f.reviewed?'Reviewed':'Mark reviewed'}</button><hr>`).join(''):'<p>No feedback yet.</p>')};
views.content=async()=>{const {content:c}=await api('GET','/content');card('App content',`<p>Announcement</p><textarea id="announcement" rows="3" maxlength="500" style="width:100%">${esc(c.announcement)}</textarea><p><label><input type="checkbox" id="cash" ${c.cashEnabled?'checked':''}> Cash preference enabled (no payment collected)</label></p><h4>Help in English and Arabic</h4><div id="helpItems">${c.help.map(helpEditor).join('')}</div><button class="s" onclick="document.querySelector('#helpItems').insertAdjacentHTML('beforeend',helpEditor({}))">Add Help item</button><p><button onclick="saveContent()">Save</button></p>`)};
function helpEditor(h){return `<fieldset class="helpedit" style="margin-bottom:16px;border:1px solid #e6eaf0;border-radius:12px;padding:16px"><p><label>Question (English)<input data-k="q" style="width:100%" value="${esc(h.q||'')}"></label></p><p><label>Question (Arabic)<input data-k="qAr" dir="rtl" style="width:100%" value="${esc(h.qAr||'')}"></label></p><p><label>Answer (English)<textarea data-k="answer" rows="2" style="width:100%">${esc(h.answer||'')}</textarea></label></p><p><label>Answer (Arabic)<textarea data-k="answerAr" dir="rtl" rows="2" style="width:100%">${esc(h.answerAr||'')}</textarea></label></p><button class="s" onclick="this.closest('fieldset').remove()">Remove</button></fieldset>`}

views.conversations=async()=>{const {conversations}=await api('GET','/conversations');card('Conversations',conversations.length?conversations.map(c=>`<p><button class="s" onclick="openChat('${c.request.id}')">${esc(sn(c.request))} · ${esc(c.request.address)}</button><br>${esc(c.last.text)}</p>`).join(''):'<p>No messages yet.</p>')};
async function openChat(id){const {messages}=await api('GET','/requests/'+id+'/messages');card('Team conversation',`${messages.map(m=>`<p><small>${esc(m.senderId)} · ${esc(new Date(m.createdAt).toLocaleString())}</small><br><span style="white-space:pre-wrap">${esc(m.text)}</span></p>`).join('')}<textarea id="reply" maxlength="2000" rows="3" style="width:100%"></textarea><p><button onclick="reply('${id}')">Send as team</button> <button class="s" onclick="show()">Back</button></p>`)}
async function reply(id){await api('POST','/requests/'+id+'/messages',{text:$('#reply').value});await openChat(id)}
async function review(id,reviewed){await api('PUT','/admin/feedback/'+id,{reviewed});await show()}
async function saveContent(){try{await api('PUT','/admin/content',{announcement:$('#announcement').value,cashEnabled:$('#cash').checked,help:[...document.querySelectorAll('.helpedit')].map(f=>Object.fromEntries([...f.querySelectorAll('[data-k]')].map(e=>[e.dataset.k,e.value])))});await show()}catch(e){alert(e.message)}}
async function avail(id,available){await api('PUT','/admin/technicians/'+id+'/availability',{available});await show()}
async function editSkills(id){const {users}=await api('GET','/admin/users');const u=users.find(u=>u.id===id);const {services}=await api('GET','/services');card('Technician services',`${services.map(s=>`<p><label><input class="skillsedit" type="checkbox" value="${esc(s.id)}" ${(u.skills||[]).includes(s.id)?'checked':''}>${esc(sn({serviceId:s.id}))}</label></p>`).join('')}<button onclick="saveSkills('${id}')">Save</button>`)}
async function saveSkills(id){await api('PUT','/admin/users/'+id+'/skills',{skills:[...document.querySelectorAll('.skillsedit:checked')].map(x=>x.value)});await show()}
function filterRequests(){requestQuery=$('#rqquery').value;requestStatus=$('#rqstatus').value;show()}
function editSvc(id){const s=window.serviceRows.find(s=>s.id===id);$('#sid').value=s.id;$('#sn').value=s.name;$('#sa').value=s.nameAr;$('#sp').checked=s.popular;$('#sactive').checked=s.active;$('#sn').focus()}
// Mutation handlers report failures without claiming that an action succeeded.
for(const n of ['blk','cancelReq','resetLink','addSvc','reply','review','avail','saveSkills']){const f=window[n];window[n]=async(...args)=>{try{return await f(...args)}catch(e){alert(e.message)}}}

function tr(root){if(lang!='ar')return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const k=n.nodeValue.trim();if(W[k])n.nodeValue=n.nodeValue.replace(k,W[k]);else if(/^[a-z_]+(: \d+| · [a-z_]+: \d+)*$/.test(k)&&k.includes(': '))n.nodeValue=k.replace(/[a-z_]+(?=:)/g,m=>W[m]||m);else if(AR[k])n.nodeValue=n.nodeValue.replace(k,AR[k])}root.querySelectorAll('[data-l]').forEach(i=>{const k=i.dataset.l;if(AR[k])i.dataset.l=AR[k]});root.querySelectorAll('[placeholder]').forEach(i=>{if(AR[i.placeholder])i.placeholder=AR[i.placeholder]})}
function setLang(l){lang=l;localStorage.setItem('lang',l);document.documentElement.lang=l;document.documentElement.dir=l=='ar'?'rtl':'ltr';$('#lang').textContent=l=='ar'?'English':'العربية';token?show():login()}
