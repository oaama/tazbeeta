name: sallehli
description: Hexa plus home services
publish_to: none
version: 1.0.0+18
environment:
  sdk: ^3.5.0
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/img/
  fonts:
    - family: NotoKufi
      fonts:
        - asset: assets/fonts/NotoKufi-Regular.ttf
        - asset: assets/fonts/NotoKufi-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoKufi-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
